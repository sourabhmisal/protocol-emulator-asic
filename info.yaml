# Tiny Tapeout project information
project:
  title:        "Protocol Emulator ASIC"      # Project title
  author:       "Sourabh Misal"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Programmable Protocol Emulator ASIC"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "6x4"          # Valid values on sg13cmos5l: 1x1, 1x2, 2x1, 2x2, 3x1, 3x2, 3x4, 4x1, 4x2, 4x4, 5x4, 6x1, 6x2, 6x4, 8x1, 8x2, 8x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_sourabhmisal_protocol_emulator"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "RM_IHPSG13_1P_1024x8_c2_bm_bist.v"  # blackbox stub of the IHP SRAM macro

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "half_period[0] / sram_byte[0]"
  ui[1]: "half_period[1] / sram_byte[1]"
  ui[2]: "half_period[2] / sram_byte[2]"
  ui[3]: "half_period[3] / sram_byte[3]"
  ui[4]: "half_period[4] / sram_byte[4]"
  ui[5]: "half_period[5] / sram_byte[5]"
  ui[6]: "half_period[6] / sram_byte[6]"
  ui[7]: "half_period[7] / sram_byte[7]"
  # Outputs
  uo[0]: "wave_out / sram_dout[0]"
  uo[1]: "sram_dout[1]"
  uo[2]: "sram_dout[2]"
  uo[3]: "sram_dout[3]"
  uo[4]: "sram_dout[4]"
  uo[5]: "sram_dout[5]"
  uo[6]: "sram_dout[6]"
  uo[7]: "sram_dout[7]"
  # Bidirectional pins
  uio[0]: "load"
  uio[1]: "sram_cmd[0]"
  uio[2]: "sram_cmd[1]"
  uio[3]: "sram_cmd[2]"
  uio[4]: "show_sram"
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
